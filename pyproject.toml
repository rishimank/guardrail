[project]
name = "guardrail"
version = "0.1.0"
description = "Automated adversarial eval framework for LLM failure modes"
requires-python = ">=3.11"

# Core deps. Deliberately does NOT include mlx-lm — see [project.optional-dependencies].
dependencies = [
    "deepeval>=1.0",       # eval framework + metrics + synthesizer
    "anthropic>=0.40",     # the judge
    # Phase 4 (LangSmith) was dropped deliberately, not skipped — the resumable JSONL
    # runs and the offline report script already cover everything the reduction claim
    # depends on. The dependency is removed rather than left dangling so that nothing
    # in the install implies a tracing story this project does not have.
    "fastapi>=0.115",      # the Phase 7 service
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "scipy>=1.14",         # Wilson score intervals (stats/)
    "numpy>=1.26",
]

[project.optional-dependencies]
# mlx-lm is Apple-Silicon-only: it will NOT install on the linux/amd64 Docker image
# or on GitHub Actions runners. Keeping it optional is what lets CI and the container
# install this package at all. They run against MockSUT, which needs no model.
mlx = [
    "mlx-lm>=0.20",
]
# PINNED EXACTLY, not >=. The Docker `test` stage runs these same tools inside the image
# and CI runs them again, so an unpinned linter means three environments checking the
# same code with three different rule sets. That is not hypothetical: the first
# containerised run installed ruff 0.16.4 against the dev machine's 0.15.21, and the
# newer default rule set produced 79 findings in code that had not changed by a
# character. A red build must mean the CODE regressed, never that a tool released.
# Bump these on purpose, see what the new rules say, and commit the fixes with the bump.
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.15.21",
    "mypy==2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guardrail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
# Must match the venv actually in use (3.13). At 3.11 mypy parsed numpy's stubs as
# invalid syntax and bailed before reaching src/ — type checking was silently a no-op.
python_version = "3.13"
ignore_missing_imports = true
